
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 足球物理模擬 - 動態載入特色球員系統</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #1a1a1a;
            color: #f0f0f0;
            display: flex;
            height: 100vh;
        }
        #canvas-container {
            flex-grow: 1;
            height: 100%;
            position: relative;
        }
        #control-panel {
            width: 360px;
            background: #242424;
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }
        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #4CAF50;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            text-align: center;
        }
        .load-player-box {
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 15px;
        }
        .load-player-box h3 {
            margin: 0 0 10px 0;
            font-size: 1.0rem;
            color: #ffca28;
            border-bottom: 1px dashed #555;
            padding-bottom: 4px;
        }
        .team-selector {
            display: flex;
            gap: 15px;
            margin: 10px 0;
            font-size: 0.95rem;
        }
        .team-selector label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .control-group {
            margin-bottom: 14px;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: #ccc;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #4CAF50;
            cursor: pointer;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 100%;
        }
        button:hover {
            background-color: #45a049;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-select-js {
            background-color: #0288d1;
        }
        .btn-select-js:hover {
            background-color: #0277bd;
        }
        .scoreboard-panel {
            margin-top: 10px;
            background: #1e1e1e;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .scoreboard-panel h3 {
            margin: 0 0 8px 0;
            font-size: 0.95rem;
            color: #ff9800;
            border-bottom: 1px dashed #444;
            padding-bottom: 4px;
        }
        .score-display {
            font-size: 1.8rem;
            font-weight: bold;
            font-family: monospace;
            color: #fff;
            margin: 8px 0;
        }
        .score-team {
            display: inline-block;
            padding: 0 10px;
        }
        .btn-reset {
            background-color: #f44336;
            font-size: 0.85rem;
            padding: 6px 12px;
            margin-top: 6px;
            width: auto;
        }
        .btn-reset:hover {
            background-color: #d32f2f;
        }
        .dashboard {
            margin-top: 15px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.85rem;
        }
        .dashboard h3 {
            margin: 0 0 8px 0;
            font-size: 0.95rem;
            color: #03a9f4;
            border-bottom: 1px dashed #444;
            padding-bottom: 4px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .stat-label {
            color: #aaa;
        }
        .stat-value {
            color: #fff;
            font-weight: bold;
        }
        .axis-x { color: #ff5252; }
        .axis-y { color: #69f0ae; }
        .axis-z { color: #448aff; }
        .goal-popup {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 152, 0, 0.9);
            color: white;
            padding: 10px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none;
            z-index: 10;
            pointer-events: none;
            animation: pulse 0.5s infinite alternate;
        }
        @keyframes pulse {
            from { transform: translateX(-50%) scale(1); }
            to { transform: translateX(-50%) scale(1.05); }
        }
    </style>
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- 載入球員共通規則與基礎類別 -->
    <script src="human_law.js"></script>
    <!-- 球員大腦在獨立 Worker 執行；不再載入 player0.js -->
</head>
<body>

    <div id="canvas-container">
        <div id="goal-popup" class="goal-popup">⚽ GOAL!! 球進啦！</div>
    </div>

    <div id="control-panel">
        <h2>物理模擬與特色球員管理</h2>

        <!-- 大腦與身體分開載入；JS 不會在主頁面執行 -->
        <div class="load-player-box">
            <h3>⚙️ 載入球員（四層架構）</h3>
            <label>大腦 JS：<input type="file" id="brain-file" accept=".js"></label>
            <div id="brain-file-label" style="font-size:0.8rem;color:#aaa">預設 brain_0.js（透過 HTTP 開啟時自動讀取）</div>
            <label>身體能力 JS：<input type="file" id="physical-file" accept=".js"></label>
            <div id="physical-file-label" style="font-size:0.8rem;color:#aaa">預設 physical_0.js（透過 HTTP 開啟時自動讀取）</div>
            <div class="team-selector">
                <span>選擇隊伍：</span>
                <label><input type="radio" name="team-choice" value="red"> 紅隊</label>
                <label><input type="radio" name="team-choice" value="blue" checked> 藍隊</label>
            </div>
            <label>回防 X：<input type="number" id="defense-x" min="-52" max="52" step="0.5" value="20" style="width:75px"></label>
            <label>回防 Z：<input type="number" id="defense-z" min="-33" max="33" step="0.5" value="0" style="width:75px"></label>
            <button id="btn-load-player" disabled>載入球員</button>
            <div id="load-status" style="font-size:0.8rem;color:#aaa">請等待預設檔載入，或自行選擇兩個 JS 檔</div>
        </div>

        <div class="control-group">
            <label>X 軸分力 (Fx): <span id="val-fx">0.0</span> N</label>
            <input type="range" id="range-fx" min="-20" max="20" step="0.5" value="0">
        </div>

        <div class="control-group">
            <label>Y 軸分力 (Fy): <span id="val-fy">0.0</span> N</label>
            <input type="range" id="range-fy" min="-20" max="20" step="0.5" value="0">
        </div>

        <div class="control-group">
            <label>Z 軸分力 (Fz): <span id="val-fz">0.0</span> N</label>
            <input type="range" id="range-fz" min="-20" max="20" step="0.5" value="0">
        </div>

        <div class="control-group">
            <label>球體質量 (M): <span id="val-mass">50</span> ×10g (<span id="val-mass-kg">0.50</span> kg)</label>
            <input type="range" id="range-mass" min="10" max="100" step="1" value="50">
        </div>

        <button id="btn-apply">🚀 手動施力 (Apply Force)</button>

        <div class="scoreboard-panel">
            <h3>即時記分板</h3>
            <div class="score-display">
                <span class="score-team" id="score-left" style="color:#ff5252;">0</span> : <span class="score-team" id="score-right" style="color:#42a5f5;">0</span>
            </div>
            <div style="font-size:0.8rem; color:#aaa; margin-bottom:5px;">左門 (紅隊防守) : 右門 (藍隊防守)</div>
            <div id="kickoff-status" style="font-size:0.8rem;margin:7px 0;color:#ddd">可以開球=false｜已重新開球=true｜球權=blue</div>
            <button class="btn-reset" id="btn-reset-score">🔄 記分板歸零</button>
        </div>

        <div class="dashboard">
            <h3>球員即時狀態儀表板</h3>
            <div id="players-dashboard-list">
                <!-- 動態生成的球員狀態 -->
            </div>
        </div>
    </div>

    <script>
        const boxWidth = 105;
        const boxHeight = 50;
        const boxDepth = 68;

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 45, 120);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 燈光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(40, 80, 50);

        dirLight.castShadow = true;
        scene.add(dirLight);

        // 邊框
        const boxGeometry = new THREE.BoxGeometry(boxWidth, boxHeight, boxDepth);
        const wireframeMaterial = new THREE.MeshBasicMaterial({ color: 0x444444, wireframe: true, transparent: true, opacity: 0.3 });
        const boxMesh = new THREE.Mesh(boxGeometry, wireframeMaterial);
        boxMesh.position.set(0, boxHeight / 2, 0);
        scene.add(boxMesh);

        // 球場草皮
        function createSoccerFieldTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 1360;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2e7d32'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#388e3c';
            const stripes = 20; const stripeWidth = canvas.width / stripes;
            for (let i = 0; i < stripes; i += 2) ctx.fillRect(i * stripeWidth, 0, stripeWidth, canvas.height);
            ctx.strokeStyle = '#ffffff'; ctx.fillStyle = '#ffffff'; ctx.lineWidth = 10;
            const w = canvas.width, h = canvas.height, margin = 80;
            const fieldW = w - margin * 2, fieldH = h - margin * 2;
            ctx.strokeRect(margin, margin, fieldW, fieldH);
            ctx.beginPath(); ctx.moveTo(w / 2, margin); ctx.lineTo(w / 2, h - margin); ctx.stroke();
            ctx.beginPath(); ctx.arc(w / 2, h / 2, fieldH * 0.15, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(w / 2, h / 2, 8, 0, Math.PI * 2); ctx.fill();
            const box18W = fieldW * 0.16, box18H = fieldH * 0.58;
            ctx.strokeRect(margin, margin + (fieldH - box18H) / 2, box18W, box18H);
            const box6W = fieldW * 0.06, box6H = fieldH * 0.24;
            ctx.strokeRect(margin, margin + (fieldH - box6H) / 2, box6W, box6H);
            ctx.strokeRect(w - margin - box18W, margin + (fieldH - box18H) / 2, box18W, box18H);
            ctx.strokeRect(w - margin - box6W, margin + (fieldH - box6H) / 2, box6W, box6H);
            return new THREE.CanvasTexture(canvas);
        }

        const floorMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(boxWidth, boxDepth),
            new THREE.MeshStandardMaterial({ map: createSoccerFieldTexture(), roughness: 0.8 })
        );
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.receiveShadow = true;
        scene.add(floorMesh);

        // 球門
        const goalWidth = 7.32, goalHeight = 2.44, goalDepth = 4.0;
        function createGoal() {
            const group = new THREE.Group();
            const postMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.8 });
            const netMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, opacity: 0.25, transparent: true });
            const p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, goalHeight), postMat);
            p1.position.set(0, goalHeight / 2, goalWidth / 2); group.add(p1);
            const p2 = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, goalHeight), postMat);
            p2.position.set(0, goalHeight / 2, -goalWidth / 2); group.add(p2);
            const cb = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, goalWidth), postMat);
            cb.rotation.z = Math.PI / 2; cb.position.set(0, goalHeight, 0); group.add(cb);
            const net = new THREE.Mesh(new THREE.BoxGeometry(goalDepth, goalHeight, goalWidth), netMat);
            net.position.set(-goalDepth / 2, goalHeight / 2, 0); group.add(net);
            return group;
        }

        const leftGoal = createGoal(); leftGoal.position.set(-boxWidth / 2, 0, 0); scene.add(leftGoal);
        const rightGoal = createGoal(); rightGoal.rotation.y = Math.PI; rightGoal.position.set(boxWidth / 2, 0, 0); scene.add(rightGoal);

        // 足球
        const ballRadius = boxWidth * 0.003 / 2;
        const ball = new THREE.Mesh(
            new THREE.SphereGeometry(ballRadius, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 })
        );
        ball.castShadow = true;
        ball.position.set(0, ballRadius, 0);
        scene.add(ball);

        let velocity = new THREE.Vector3(0, 0, 0);
        let acceleration = new THREE.Vector3(0, -9.8, 0);
        const gravity = -9.8;
        const restitutionFloor = 0.75, frictionCoefficient = 0.985;
        let scoreLeft = 0, scoreRight = 0;
        // 球權及重新開球狀態由主程式持有，Brain 只能接收副本。
        const matchState = { canKickoff: false, restarted: true, possession: 'blue' };
        function everyoneInOwnHalf() {
            return activePlayers.every(p => p.team === 'blue'
                ? p.state.position.x >= -1e-6
                : p.state.position.x <= 1e-6);
        }
        function updateKickoffPermission() {
            if (!matchState.restarted) matchState.canKickoff = everyoneInOwnHalf();
        }
        function beginKickoff(possession) {
            resetBall();
            matchState.restarted = false;
            matchState.possession = possession;
            matchState.canKickoff = false;
            // 清除舊的追球願望與足球記憶，避免進球前的指令殘留。
            for (const p of activePlayers) {
                p.wish = null;
                p.worker.postMessage({ type: 'reset' });
            }
            updateKickoffPermission();
        }

        // 球員狀態由引擎持有，Brain 只收到結構化資料副本。
        const activePlayers = [];
        const RULES = window.HumanLaw;
        const fieldInfo = { width: boxWidth, depth: boxDepth, ballRadius };
        let nextPlayerId = 1;

        // 建立球員 3D 模型
        function spawnPlayerModel(teamColor, posX, posZ, playerName) {
            const group = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const jerseyColor = (teamColor === 'red') ? 0xe53935 : 0x1e88e5;
            const jerseyMat = new THREE.MeshStandardMaterial({ color: jerseyColor });
            const shortsMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const visorMat = new THREE.MeshStandardMaterial({ color: 0xffeb3b });

            // 頭、眼面導向、軀幹、雙腿
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), skinMat); head.position.set(0, 1.65, 0); group.add(head);
            const face = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.05, 0.12), visorMat); face.position.set(0, 1.67, 0.12); group.add(face);
            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.18, 0.7), jerseyMat); torso.position.set(0, 1.15, 0); group.add(torso);
            const shorts = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.3), shortsMat); shorts.position.set(0, 0.65, 0); group.add(shorts);
            const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.07, 0.5), skinMat); legL.position.set(0.1, 0.25, 0); group.add(legL);
            const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.07, 0.5), skinMat); legR.position.set(-0.1, 0.25, 0); group.add(legR);

            // 頭頂 3D 血條
            const hpGroup = new THREE.Group(); hpGroup.position.set(0, 2.1, 0);
            const bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.22), new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide }));
            hpGroup.add(bgMesh);

            const fillGeo = new THREE.PlaneGeometry(1.5, 0.16); fillGeo.translate(0.75, 0, 0);
            const fillMesh = new THREE.Mesh(fillGeo, new THREE.MeshBasicMaterial({ color: 0x4caf50, side: THREE.DoubleSide }));
            fillMesh.position.set(-0.75, 0, 0.01);
            hpGroup.add(fillMesh);
            group.add(hpGroup);

            group.position.set(posX, 0, posZ);
            group.rotation.y = (teamColor === 'red') ? Math.PI / 2 : -Math.PI / 2;
            scene.add(group);

            return { group, fillMesh };
        }

        // 解析設定檔的 JSON 區塊，不執行 physical_0.js 的任何程式。
        function parsePhysicalSource(source) {
            const match = source.match(/PHYSICAL_PROFILE_START\s*([\s\S]*?)\s*PHYSICAL_PROFILE_END/);
            if (!match) throw new Error('身體設定檔缺少 PHYSICAL_PROFILE_START / END');
            const data = JSON.parse(match[1]);
            if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('身體設定必須是 JSON 物件');
            return { name: String(data.name || '球員').slice(0, 40), physical: RULES.physical(data) };
        }
        // 大腦名稱放在註解中的 JSON 設定區，不會執行 JS 原始碼。
        // 未提供名稱的舊版大腦仍可使用。
        function parseBrainSource(source, filename = '') {
            const match = source.match(/BRAIN_PROFILE_START\s*([\s\S]*?)\s*BRAIN_PROFILE_END/);
            if (match) {
                const data = JSON.parse(match[1]);
                if (!data || typeof data !== 'object' || Array.isArray(data)) {
                    throw new Error('大腦設定必須是 JSON 物件');
                }
                return { name: String(data.name || '未命名AI').slice(0, 40) };
            }
            return { name: filename ? filename.replace(/\.js$/i, '') : '未命名AI' };
        }
        function readFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(String(reader.result));
                reader.onerror = () => reject(reader.error);
                reader.readAsText(file);
            });
        }
        let brainSource = null, physicalSource = null;
        const brainInput = document.getElementById('brain-file');
        const physicalInput = document.getElementById('physical-file');
        const loadBtn = document.getElementById('btn-load-player');
        const loadStatus = document.getElementById('load-status');
        function validateLoadForm() {
            const x = Number(document.getElementById('defense-x').value);
            const z = Number(document.getElementById('defense-z').value);
            const valid = brainSource && physicalSource && Number.isFinite(x) && Number.isFinite(z) &&
                Math.abs(x) <= boxWidth / 2 - 1 && Math.abs(z) <= boxDepth / 2 - 1;
            loadBtn.disabled = !valid;
            if (valid) loadStatus.textContent = '大腦與身體檔案就緒，可以載入球員';
        }
        for (const id of ['defense-x', 'defense-z']) document.getElementById(id).addEventListener('input', validateLoadForm);
        brainInput.addEventListener('change', async () => {
            brainSource = null;
            if (brainInput.files[0]) {
                try { brainSource = await readFile(brainInput.files[0]); }
                catch (e) { loadStatus.textContent = '大腦檔讀取失敗：' + e.message; }
            }
            validateLoadForm();
        });
        physicalInput.addEventListener('change', async () => {
            physicalSource = null;
            if (physicalInput.files[0]) {
                try { physicalSource = await readFile(physicalInput.files[0]); parsePhysicalSource(physicalSource); }
                catch (e) { loadStatus.textContent = '身體檔無效：' + e.message; }
            }
            validateLoadForm();
        });
        // 透過本機 HTTP server 開啟時，預設使用 brain_0.js 和 physical_0.js。
        // 若直接 file:// 開啟，瀏覽器可能禁止 fetch；可改用上方檔案選擇器。
        Promise.all([fetch('brain_0.js').then(r => { if (!r.ok) throw Error('brain'); return r.text(); }),
                     fetch('physical_0.js').then(r => { if (!r.ok) throw Error('physical'); return r.text(); })])
          .then(([brain, physical]) => {
              if (!brainInput.files.length) brainSource = brain;
              if (!physicalInput.files.length) { parsePhysicalSource(physical); physicalSource = physical; }
              validateLoadForm();
          }).catch(() => { loadStatus.textContent = '請選取 brain_0.js 與 physical_0.js（直接開啟 HTML 時需手動選檔）'; });

        loadBtn.addEventListener('click', () => {
            try {
                if (!brainSource || !physicalSource) throw new Error('請先選擇大腦和身體檔案');
                const team = document.querySelector('input[name="team-choice"]:checked').value;
                const x = Number(document.getElementById('defense-x').value);
                const z = Number(document.getElementById('defense-z').value);
                if (!Number.isFinite(x) || !Number.isFinite(z) || Math.abs(x) > 51.5 || Math.abs(z) > 33)
                    throw new Error('回防座標超出球場範圍');
                const parsed = parsePhysicalSource(physicalSource);
                const brain = parseBrainSource(brainSource, brainInput.files[0]?.name || 'brain_0.js');
                const blob = new Blob([brainSource], { type: 'text/javascript' });
                const url = URL.createObjectURL(blob);
                let worker;
                try { worker = new Worker(url); } finally { URL.revokeObjectURL(url); }
                const id = nextPlayerId++;
                const name = `${parsed.name} + ${brain.name} #${id}`;
                const model = spawnPlayerModel(team, x, z, name);
                const player = {
                    id, name, team, mesh: model.group, fillMesh: model.fillMesh, worker,
                    physical: parsed.physical, defensePosition: { x, z },
                    assignedPosition: { x, z },
                    state: { position: { x, z }, velocity: { x: 0, z: 0 },
                        facing: team === 'red' ? Math.PI / 2 : -Math.PI / 2,
                        stamina: parsed.physical.maxStamina, restTimer: 0, kickCooldown: 0 },
                    wish: null, status: '等待大腦啟動', pending: false, seq: 0
                };
                worker.onmessage = e => {
                    if (e.data.id !== player.seq) return;
                    player.pending = false;
                    if (e.data.error) { player.status = '大腦錯誤'; return; }
                    player.wish = RULES.action(e.data.wish);
                    player.status = String(e.data.wish?.status || '行動中').slice(0, 60);
                };
                worker.onerror = e => { player.pending = false; player.status = '大腦執行錯誤'; console.error(e); };
                activePlayers.push(player);
                updateKickoffPermission();
                loadStatus.textContent = '已載入 ' + name + '（' + team + '）';
            } catch (e) { loadStatus.textContent = '載入失敗：' + e.message; }
        });

        function observe(player) {
            const s = player.state;
            const forward = { x: Math.sin(s.facing), z: Math.cos(s.facing) };

            function visible(pos) {
                const dx = pos.x - s.position.x;
                const dz = pos.z - s.position.z;
                const dist = Math.hypot(dx, dz);

                return dist < 0.01 ||
                    (dx * forward.x + dz * forward.z) / dist >=
                    Math.cos(RULES.SETTINGS.fovRadians / 2);
            }

            const objects = [];

            if (visible(ball.position)) {
                objects.push({
                    id: 'ball',
                    type: 'ball',
                    position: {
                        x: ball.position.x,
                        y: ball.position.y,
                        z: ball.position.z
                    },
                    velocity: {
                        x: velocity.x,
                        y: velocity.y,
                        z: velocity.z
                    },
                    acceleration: {
                        x: 0,
                        y: gravity,
                        z: 0
                    }
                });
            }

            for (const other of activePlayers) {
                if (other === player || !visible(other.state.position)) {
                    continue;
                }

                objects.push({
                    id: 'player_' + other.id,
                    type: 'player',
                    team: other.team,
                    position: { ...other.state.position },
                    velocity: { ...other.state.velocity },
                    acceleration: { x: 0, z: 0 }
                });
            }

            for (const [id, goal, team] of [
                ['leftGoal', leftGoal, 'red'],
                ['rightGoal', rightGoal, 'blue']
            ]) {
                if (visible(goal.position)) {
                    objects.push({
                        id,
                        type: 'goal',
                        team,
                        position: {
                            x: goal.position.x,
                            y: 0,
                            z: goal.position.z
                        },
                        velocity: { x: 0, y: 0, z: 0 },
                        acceleration: { x: 0, y: 0, z: 0 }
                    });
                }
            }

            return {
                self: {
                    id: player.id,
                    team: player.team,
                    position: { ...s.position },
                    velocity: { ...s.velocity },
                    facing: s.facing,
                    stamina: s.stamina,
                    maxStamina: player.physical.maxStamina,
                    resting: s.restTimer > 0
                },
                visibleObjects: objects,
                defensePosition: { ...player.defensePosition },
                assignedPosition: { ...player.assignedPosition },
                matchState: { ...matchState }
            };
        }

        // UI 與儀表板更新
        const rangeFx = document.getElementById('range-fx');
        const rangeFy = document.getElementById('range-fy');
        const rangeFz = document.getElementById('range-fz');
        const rangeMass = document.getElementById('range-mass');

        const valFx = document.getElementById('val-fx');
        const valFy = document.getElementById('val-fy');
        const valFz = document.getElementById('val-fz');
        const valMass = document.getElementById('val-mass');
        const valMassKg = document.getElementById('val-mass-kg');

        const scoreLeftEl = document.getElementById('score-left');
        const scoreRightEl = document.getElementById('score-right');
        const btnResetScore = document.getElementById('btn-reset-score');
        const dashboardList = document.getElementById('players-dashboard-list');

        function updateUI() {
            valFx.textContent = parseFloat(rangeFx.value).toFixed(1);
            valFy.textContent = parseFloat(rangeFy.value).toFixed(1);
            valFz.textContent = parseFloat(rangeFz.value).toFixed(1);
            valMass.textContent = rangeMass.value;
            valMassKg.textContent =
                (parseInt(rangeMass.value) * 0.01).toFixed(2);
        }

        [rangeFx, rangeFy, rangeFz, rangeMass].forEach(input => {
            input.addEventListener('input', updateUI);
        });

        updateUI();

        btnResetScore.addEventListener('click', () => {
            scoreLeft = 0;
            scoreRight = 0;
            scoreLeftEl.textContent = 0;
            scoreRightEl.textContent = 0;
        });

        document.getElementById('btn-apply').addEventListener('click', () => {
            if (!matchState.restarted) {
                loadStatus.textContent =
                    '等待重新開球：暫時禁止手動對球施力';
                return;
            }

            const m = parseInt(rangeMass.value) * 0.01;

            velocity.x += (parseFloat(rangeFx.value) / m) * 0.1;
            velocity.y += (parseFloat(rangeFy.value) / m) * 0.1;
            velocity.z += (parseFloat(rangeFz.value) / m) * 0.1;
        });

        function resetBall() {
            ball.position.set(0, ballRadius, 0);
            velocity.set(0, 0, 0);
        }

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            let dt = clock.getDelta();
            if (dt > 0.1) dt = 0.1;

            const mass = parseInt(rangeMass.value) * 0.01;
            let dashHTML = "";

            // AI 在 Worker 中非同步思考；
            // 主程式只接受意圖並依人體規則執行。
            updateKickoffPermission();

            for (const p of activePlayers) {
                if (!p.pending) {
                    p.pending = true;
                    p.seq++;

                    p.worker.postMessage({
                        type: 'decide',
                        id: p.seq,
                        dt,
                        observation: observe(p)
                    });
                }

                // 即使 Brain 嘗試作弊，開球前也只能由
                // 有球權隊在允許時踢球。
                const canKick =
                    matchState.restarted ||
                    (
                        matchState.canKickoff &&
                        matchState.possession === p.team
                    );

                const wish = p.wish && !canKick
                    ? {
                        ...p.wish,
                        kick: { x: 0, y: 0, z: 0 }
                    }
                    : p.wish;

                const result = RULES.advance(
                    p,
                    wish,
                    dt,
                    ball.position,
                    velocity,
                    mass,
                    fieldInfo
                );

                if (
                    result.kicked &&
                    !matchState.restarted &&
                    canKick
                ) {
                    matchState.restarted = true;
                    matchState.canKickoff = false;
                }

                p.mesh.position.set(
                    p.state.position.x,
                    0,
                    p.state.position.z
                );

                p.mesh.rotation.y = p.state.facing;

                if (p.mesh.children[6]) {
                    p.mesh.children[6].quaternion.copy(
                        camera.quaternion
                    );
                }

                const ratio =
                    p.state.stamina / p.physical.maxStamina;

                p.fillMesh.scale.x =
                    Math.max(0, Math.min(1, ratio));

                p.fillMesh.material.color.setHex(
                    ratio > 0.5
                        ? 0x4caf50
                        : ratio > 0.2
                            ? 0xffc107
                            : 0xf44336
                );

                const teamTag =
                    p.team === 'red' ? '[紅隊]' : '[藍隊]';

                const status =
                    result.resting ? '喘氣中' : p.status;

                // 避免名稱與狀態中的特殊字元被解讀成 HTML
                const safe = t =>
                    String(t).replace(
                        /[&<>"']/g,
                        c => ({
                            '&': '&amp;',
                            '<': '&lt;',
                            '>': '&gt;',
                            '"': '&quot;',
                            "'": '&#39;'
                        }[c])
                    );

                dashHTML += `
                    <div style="border-bottom:1px solid #333;padding:6px">
                        <b>${teamTag} ${safe(p.name)}</b>
                        <div>
                            體能：${p.state.stamina.toFixed(0)}
                            / ${p.physical.maxStamina.toFixed(0)}
                        </div>
                        <div>狀態：${safe(status)}</div>
                        <div>
                            速度：${Math.hypot(
                                p.state.velocity.x,
                                p.state.velocity.z
                            ).toFixed(2)} m/s
                        </div>
                    </div>
                `;
            }

            // 球員兩兩碰撞
            for (let i = 0; i < activePlayers.length; i++) {
                for (
                    let j = i + 1;
                    j < activePlayers.length;
                    j++
                ) {
                    RULES.collide(
                        activePlayers[i],
                        activePlayers[j]
                    );
                }
            }

            for (const p of activePlayers) {
                p.state.position.x = Math.max(
                    -boxWidth / 2 + p.physical.bodyRadius,
                    Math.min(
                        boxWidth / 2 - p.physical.bodyRadius,
                        p.state.position.x
                    )
                );

                p.state.position.z = Math.max(
                    -boxDepth / 2 + p.physical.bodyRadius,
                    Math.min(
                        boxDepth / 2 - p.physical.bodyRadius,
                        p.state.position.z
                    )
                );

                p.mesh.position.set(
                    p.state.position.x,
                    0,
                    p.state.position.z
                );
            }

            updateKickoffPermission();

            document.getElementById('kickoff-status').textContent =
                `可以開球=${matchState.canKickoff}｜` +
                `已重新開球=${matchState.restarted}｜` +
                `球權=${matchState.possession}`;

            dashboardList.innerHTML = dashHTML;

            // --- 足球物理運動計算 ---
            acceleration.set(0, gravity, 0);

            velocity.x += acceleration.x * dt;
            velocity.y += acceleration.y * dt;
            velocity.z += acceleration.z * dt;

            if (
                Math.abs(ball.position.y - ballRadius) < 0.05
            ) {
                velocity.x *= Math.pow(
                    frictionCoefficient,
                    dt * 60
                );

                velocity.z *= Math.pow(
                    frictionCoefficient,
                    dt * 60
                );
            }

            ball.position.x += velocity.x * dt;
            ball.position.y += velocity.y * dt;
            ball.position.z += velocity.z * dt;

            const maxX = boxWidth / 2 - ballRadius;
            const maxZ = boxDepth / 2 - ballRadius;
            const minY = ballRadius;
            const maxY = boxHeight - ballRadius;

            // 進球判斷
            if (
                ball.position.x <= -boxWidth / 2 + ballRadius &&
                ball.position.y <= goalHeight &&
                Math.abs(ball.position.z) <= goalWidth / 2
            ) {
                scoreRight++;
                scoreRightEl.textContent = scoreRight;
                beginKickoff('red');

            } else if (
                ball.position.x >= boxWidth / 2 - ballRadius &&
                ball.position.y <= goalHeight &&
                Math.abs(ball.position.z) <= goalWidth / 2
            ) {
                scoreLeft++;
                scoreLeftEl.textContent = scoreLeft;
                beginKickoff('blue');

            } else {
                if (ball.position.x > maxX) {
                    ball.position.x = maxX;
                    velocity.x = -velocity.x;

                } else if (ball.position.x < -maxX) {
                    ball.position.x = -maxX;
                    velocity.x = -velocity.x;
                }
            }

            if (ball.position.z > maxZ) {
                ball.position.z = maxZ;
                velocity.z = -velocity.z;

            } else if (ball.position.z < -maxZ) {
                ball.position.z = -maxZ;
                velocity.z = -velocity.z;
            }

            if (ball.position.y > maxY) {
                ball.position.y = maxY;
                velocity.y = -velocity.y;

            } else if (ball.position.y < minY) {
                ball.position.y = minY;
                velocity.y = -velocity.y * restitutionFloor;

                if (Math.abs(velocity.y) < 0.2) {
                    velocity.y = 0;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect =
                container.clientWidth / container.clientHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                container.clientWidth,
                container.clientHeight
            );
        });
    </script>
</body>
</html>
